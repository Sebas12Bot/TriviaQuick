# =====================================================================
# TriviaQuick - configuración. Los secretos llegan por variables de entorno
# (ver backend/.env.example). Nada sensible se guarda en el código.
# =====================================================================
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: triviaquick
  datasource:
    # Vacío => se inicia un PostgreSQL embebido (solo para desarrollo local).
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
  mail:
    # Vacío => los correos no se envían: el enlace de verificación se escribe en el log (solo desarrollo).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html

triviaquick:
  db:
    pool-size: ${DB_POOL_SIZE:10}
  jwt:
    # Obligatorio en producción (mínimo 32 bytes). Vacío => se genera una clave local de desarrollo.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
  cookie:
    name: tq_session
    # En producción con HTTPS: COOKIE_SECURE=true. Si frontend y API están en dominios distintos: COOKIE_SAME_SITE=None.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    # Lista separada por comas de orígenes autorizados. En producción, la URL exacta del frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    # Código necesario para registrar cuentas de docente. Vacío => el registro de docentes está deshabilitado.
    teacher-signup-code: ${TEACHER_SIGNUP_CODE:}
  rate-limit:
    # Máximo de respuestas (preguntas + minijuegos) por usuario dentro de la ventana.
    answers-per-window: ${ANSWER_RATE_LIMIT:12}
    window-seconds: ${ANSWER_RATE_WINDOW_SECONDS:10}
  game:
    lightning-bonus: 300
    duel-stake: 250
    lightning-seconds: 20
    duel-seconds: 20
    power-up-seconds: 15
    answer-grace-millis: 1000
  seed:
    # Datos de demostración (cuentas y una trivia marcadas como ejemplo). Desactivar en producción.
    demo-data: ${SEED_DEMO_DATA:true}
    demo-password: ${DEMO_PASSWORD:}
  storage:
    # Directorio de imágenes subidas (avatares y cuestionarios). En producción, un volumen persistente.
    dir: ${UPLOAD_DIR:${user.home}/.triviaquick/uploads}
    max-upload-bytes: 3145728
  mail:
    from: ${MAIL_FROM:TriviaQuick <no-reply@triviaquick.local>}
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  embedded-db:
    port: ${EMBEDDED_DB_PORT:5434}
    data-dir: ${EMBEDDED_DB_DIR:${user.home}/.triviaquick/pgdata}
    clean: false

logging:
  level:
    root: INFO
    com.triviaquick: INFO
